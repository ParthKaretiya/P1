<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>404 — Page Not Found | Nirayush EduTech</title>
  <meta name="description" content="The page you are looking for does not exist or has been moved." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrap { text-align: center; max-width: 480px; }
    .code {
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 800;
      background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: 16px 0 12px; color: #0f172a; }
    p { color: #475569; line-height: 1.6; margin-bottom: 28px; font-size: 1rem; }
    .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px; border-radius: 9999px; font-weight: 600;
      text-decoration: none; font-size: 0.92rem; transition: all 0.25s ease;
    }
    .btn-primary { background: #0f172a; color: #fff; }
    .btn-primary:hover { background: #1e293b; transform: translateY(-2px); }
    .btn-outline { background: #fff; color: #0f172a; border: 1.5px solid #cbd5e1; }
    .btn-outline:hover { background: #0f172a; color: #fff; border-color: #0f172a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>Oops! The page you're looking for doesn't exist, has been removed, or is temporarily unavailable.</p>
    <div class="btns">
      <a href="/" class="btn-primary">🏠 Return to Home</a>
      <a href="/courses" class="btn-outline">📚 View Courses</a>
    </div>
  </div>
</body>
</html>
